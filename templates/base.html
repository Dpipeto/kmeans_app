<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}K-Means Clustering{% endblock %} · ClusterLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #08090d;
      --surface: #0f1117;
      --surface2: #161820;
      --border: #1e2130;
      --accent: #6ee7f7;
      --accent2: #a78bfa;
      --accent3: #34d399;
      --accent4: #fb923c;
      --accent5: #f472b6;
      --text: #e8eaf2;
      --muted: #6b7280;
      --danger: #f87171;
      --cluster-colors: #6ee7f7, #a78bfa, #34d399, #fb923c, #f472b6, #facc15, #60a5fa, #f43f5e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Background grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(110,231,247,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110,231,247,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    /* ── NAV ─────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(8,9,13,.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0;
      padding: 0 2rem;
      height: 58px;
    }
    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: -.02em;
      text-decoration: none;
      margin-right: 2.5rem;
      flex-shrink: 0;
    }
    .nav-brand span { color: var(--accent2); }
    .nav-links { display: flex; gap: 0; flex: 1; }
    .nav-links a {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: .78rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding: 0 1.1rem;
      height: 58px;
      display: flex; align-items: center;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* ── LAYOUT ──────────────────────────────── */
    .page { position: relative; z-index: 1; padding-top: 58px; min-height: 100vh; }
    .hero {
      padding: 5rem 3rem 3rem;
      max-width: 900px;
    }
    .hero-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      color: var(--accent);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: .8rem;
      opacity: .8;
    }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: -.04em;
      margin-bottom: 1.2rem;
    }
    .hero p {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 600px;
    }
    .content { padding: 0 3rem 5rem; max-width: 1200px; }
    /* ── CARDS ───────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -.01em;
      margin-bottom: 1rem;
      display: flex; align-items: center; gap: .6rem;
    }
    .card-title .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    /* ── GRID ────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; }
    /* ── STAT PILL ───────────────────────────── */
    .stat-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      display: flex; flex-direction: column; gap: .3rem;
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--accent);
    }
    /* ── CHART WRAPPER ───────────────────────── */
    .chart-wrap {
      position: relative;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }
    /* ── TABLE ───────────────────────────────── */
    .tbl-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    th {
      background: var(--surface2);
      padding: .75rem 1rem;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: .6rem 1rem;
      border-bottom: 1px solid rgba(30,33,48,.6);
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .2rem .6rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      font-weight: 500;
    }
    /* ── SLIDER ──────────────────────────────── */
    .slider-wrap { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    input[type=range] {
      -webkit-appearance: none;
      width: 220px; height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .k-display {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      color: var(--accent);
      min-width: 2.5rem;
    }
    /* ── LOADING ─────────────────────────────── */
    .loading {
      display: flex; align-items: center; justify-content: center;
      gap: .6rem; padding: 3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      color: var(--muted);
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ── CODE BLOCK ──────────────────────────── */
    .code-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      line-height: 1.8;
      color: var(--accent3);
      overflow-x: auto;
    }
    .code-block .kw { color: var(--accent2); }
    .code-block .cm { color: var(--muted); font-style: italic; }
    /* ── SECTION DIVIDER ─────────────────────── */
    .section-head {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -.02em;
      margin: 2.5rem 0 1rem;
      padding-bottom: .6rem;
      border-bottom: 1px solid var(--border);
    }
    /* ── INTERPRETATION BOX ──────────────────── */
    .interp {
      border-left: 3px solid var(--accent);
      padding: 1rem 1.5rem;
      background: rgba(110,231,247,.04);
      border-radius: 0 8px 8px 0;
      font-size: .9rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }
    .interp strong { color: var(--accent); font-family: 'Syne', sans-serif; }
    /* ── RESPONSIVE ──────────────────────────── */
    @media (max-width: 768px) {
      .hero { padding: 4rem 1.5rem 2rem; }
      .content { padding: 0 1.5rem 3rem; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      nav { padding: 0 1rem; }
      .nav-links a { padding: 0 .6rem; font-size: .7rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-brand">Cluster<span>Lab</span></a>
  <div class="nav-links">
    <a href="/" class="{% if request.path == '/' %}active{% endif %}">Inicio</a>
    <a href="/dataset" class="{% if request.path == '/dataset' %}active{% endif %}">Dataset</a>
    <a href="/conceptos" class="{% if request.path == '/conceptos' %}active{% endif %}">Conceptos</a>
    <a href="/modelo" class="{% if request.path == '/modelo' %}active{% endif %}">Modelo</a>
    <a href="/resultados" class="{% if request.path == '/resultados' %}active{% endif %}">Resultados</a>
  </div>
</nav>
<div class="page">
  {% block content %}{% endblock %}
</div>
</body>
</html>
